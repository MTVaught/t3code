name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

# Every push to `main` publishes a nightly release. Stable releases are
# triggered by a `v*.*.*` tag push or a manual "Run workflow"
# (workflow_dispatch).

# Serialize nightlies (main pushes and manual) so overlapping runs cannot
# build the same commit twice or publish out of order. Stable releases get
# their own group so a nightly never blocks them. Running publishers are never
# canceled, and queue: max keeps every pending run instead of the default
# newest-wins single slot, so a queued stable tag can never be silently
# dropped.
concurrency:
  group: release-${{ ((github.event_name == 'push' && github.ref_type == 'branch') || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Main-branch pushes and manually dispatched nightly releases derive
          # a version from the date + run number + SHA. Stable releases still
          # come from a v*.*.* tag push or a workflow_dispatch with a version.
          if [[ ( "${GITHUB_EVENT_NAME}" == "push" && "${REF_TYPE}" == "branch" ) \
             || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ) ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases require the version input." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=T3 Code v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Everything except `t3` (apps/server), which `quality_server` shards
      # below. Same split as ci.yml: these `test` tasks declare no `dependsOn`
      # and resolve workspace deps from source, so `--parallel` only drops idle
      # time between dependency layers.
      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server sets `fileParallelism: false`, so its test files run one at a
  # time and on their own take longer than the rest of the suite. Running them
  # inside `quality` pushed that job past its 10-minute limit on every recent
  # release. Shard them over separate runners as ci.yml does.
  quality_server:
    name: Release quality checks (server ${{ matrix.shard }})
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime.
      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The platform-independent JS (server bundle, web client, Electron main) is
  # built exactly once here and handed to every platform job as `js-bundle`.
  # Fork note: upstream bakes the T3 Connect relay URL and Clerk client config
  # into this bundle from its relay public-config job. The fork removed that
  # job, so T3CODE_CLERK_* / T3CODE_RELAY_URL are not set here. Set them as
  # repo variables and export them on this job if you run your own relay.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install bundle dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper on a
      # Linux host before packing, and that needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Runs t3#build (which depends on @t3tools/web#build) and
      # @t3tools/desktop#build, so apps/server/dist holds the server bundle
      # plus the web client and apps/desktop/dist-electron the Electron main.
      - name: Build JS bundle
        run: vp run build:desktop

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_linux_native:
    name: Build Linux native components (RHEL 8 ABI)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    container: rockylinux:8
    timeout-minutes: 30
    env:
      # Keep this source revision aligned with @ff-labs/fff-node in
      # apps/server/package.json. Its npm Linux binary currently requires a
      # newer glibc than RHEL 8, so releases rebuild the same C ABI here.
      FFF_SOURCE_REF: 7d7910b6ba78ea8406671eaac8cdb5eb9850d9d1
      FFF_SOURCE_VERSION: 0.9.4
    steps:
      - name: Install RHEL 8 build dependencies
        run: dnf install -y git gcc gcc-c++ make python3.11 perl-core cmake curl xz tar gzip binutils

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Checkout fff source
        uses: actions/checkout@v6
        with:
          repository: dmtrKovalenko/fff
          ref: ${{ env.FFF_SOURCE_REF }}
          path: .release/fff

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build native components
        shell: bash
        env:
          PYTHON: /usr/bin/python3.11
        run: |
          set -euo pipefail
          node_pty_version="$(node -p "require('./apps/server/package.json').dependencies['node-pty'].replace(/^\\^/, '')")"
          fff_version="$(node -p "require('./apps/server/package.json').dependencies['@ff-labs/fff-node']")"
          if [[ "$fff_version" != "$FFF_SOURCE_VERSION" ]]; then
            echo "Update FFF_SOURCE_REF/FFF_SOURCE_VERSION for @ff-labs/fff-node $fff_version." >&2
            exit 1
          fi

          mkdir -p .release/native-runtime linux-native
          npm install --ignore-scripts --prefix .release/native-runtime \
            "node-pty@$node_pty_version" \
            "@ff-labs/fff-node@$fff_version"
          node_pty_dir="$PWD/.release/native-runtime/node_modules/node-pty"
          (
            cd "$node_pty_dir"
            npx --yes node-gyp@12.4.0 configure
            # GCC 8 implements C++20 under its provisional gnu++2a spelling.
            # The language mode is equivalent for node-pty, while retaining
            # RHEL 8's system libstdc++ ABI floor.
            sed -i 's/-std=gnu++20/-std=gnu++2a/g' build/*.mk
            make -C build BUILDTYPE=Release
            node scripts/post-install.js
          )

          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu
          cargo build --locked --release \
            --manifest-path .release/fff/Cargo.toml \
            --package fff-c \
            --target x86_64-unknown-linux-gnu

          cp .release/native-runtime/node_modules/node-pty/build/Release/pty.node \
            linux-native/pty.node
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            linux-native/t3-resource-monitor
          cp .release/fff/target/x86_64-unknown-linux-gnu/release/libfff_c.so \
            linux-native/libfff_c.so
          cp linux-native/libfff_c.so \
            .release/native-runtime/node_modules/@ff-labs/fff-bin-linux-x64-gnu/libfff_c.so

      - name: Verify native functionality on RHEL 8
        shell: bash
        run: |
          set -euo pipefail
          test "$(rpm -E '%{rhel}')" = "8"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

          for binary in linux-native/pty.node linux-native/t3-resource-monitor linux-native/libfff_c.so; do
            required="$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)"
            if [[ "$(printf '%s\n' "$required" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]]; then
              echo "$binary requires $required; RHEL 8 provides GLIBC_2.28." >&2
              exit 1
            fi
          done

          node <<'NODE'
          const nodePty = require("./.release/native-runtime/node_modules/node-pty");
          const terminal = nodePty.spawn("/bin/sh", ["-c", "printf rhel8-pty-ok"], {
            name: "xterm",
            cols: 80,
            rows: 24,
          });
          let output = "";
          terminal.onData((chunk) => (output += chunk));
          terminal.onExit(({ exitCode }) => {
            if (exitCode !== 0 || !output.includes("rhel8-pty-ok")) process.exit(1);
          });
          NODE

          printf '%s\n' '{"type":"shutdown","version":2}' \
            | linux-native/t3-resource-monitor \
            | grep '"type":"hello"'

          node --input-type=module <<'NODE'
          import { FileFinder } from "./.release/native-runtime/node_modules/@ff-labs/fff-node/dist/src/index.js";
          const result = FileFinder.create({ basePath: process.cwd(), disableMmapCache: true });
          if (!result.ok) throw new Error(result.error);
          const finder = result.value;
          const ready = await finder.waitForIndexReady(15_000);
          if (!ready.ok || !ready.value) throw new Error("fff index did not become ready");
          const search = finder.fileSearch("package.json", { pageSize: 10 });
          finder.destroy();
          if (!search.ok || !search.value.items.some((item) => item.relativePath === "package.json")) {
            throw new Error("fff did not find package.json");
          }
          NODE

      - name: Upload RHEL 8-compatible native components
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-x64
          path: linux-native/*
          if-no-files-found: error

  # The self-contained Linux x64 CLI archive (t3-<version>-linux-x64.tar.gz).
  # Its own job rather than a step of the Linux matrix entry because the
  # Windows entry embeds it as the WSL runtime, and a matrix job cannot depend
  # on a sibling entry. The archive ships the RHEL 8-built resource monitor;
  # its node-pty is compiled by `vp install --prod` on this runner, so the
  # archive's glibc floor is this runner's, not RHEL 8's (the AppImage is
  # unaffected: it stages the RHEL 8 prebuilds and is verified on Rocky 8).
  build_linux_cli:
    name: Build CLI archive (linux-x64)
    needs: [preflight, build_bundle, build_linux_native]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' && needs.build_linux_native.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install CLI dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=t3... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The archive takes the web client from apps/server/dist/client, which
      # the bundle job built; the artifact root is `apps/`.
      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      - name: Download RHEL 8-compatible Linux native components
        uses: actions/download-artifact@v8
        with:
          name: linux-native-x64
          path: linux-native

      # The single-executable is built with a Node that supports --build-sea
      # (25.7+); the repo itself stays on the engines.node version. It always
      # injects into the runner's own Node.
      - name: Build CLI single-executable
        shell: bash
        env:
          # The exact version, not a major: vp downloads it from nodejs.org/dist on
          # the runner, and only exact versions have a dist directory. Keep in
          # step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor for the CLI archive
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$target_dir"
          cp linux-native/t3-resource-monitor "$target_dir/t3-resource-monitor"
          chmod +x "$target_dir/t3-resource-monitor"

      - name: Build CLI archive
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # Native prebuild and CLI archive jobs are in `needs` for ordering/artifact
    # availability. Do not require their success here: `!cancelled()` lets
    # unaffected platforms build; the platform-specific artifact download fails
    # only the dependent build. Every platform packages the shared JS bundle.
    needs: [preflight, build_bundle, build_linux_native, build_linux_cli]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.build_bundle.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    # Fork note: the upstream relay public-config job (which reads T3 Connect
    # public config out of Cloudflare) was removed, so these T3CODE_CLERK_* /
    # T3CODE_RELAY_URL values are not injected here. Builds are unsigned and
    # point at no relay. Set them as repo variables/secrets and wire them back
    # in if you run your own relay.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            timeout_minutes: 90
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
          - label: Linux x64
            runner: ubuntu-latest
            timeout_minutes: 30
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            # The Linux archive is built by build_linux_cli (see there).
            cli_archive: false
          - label: Windows x64
            runner: windows-latest
            timeout_minutes: 30
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: true
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Resolve Windows package cache path
        if: matrix.platform == 'win'
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        if: matrix.platform == 'win'
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Install desktop dependencies
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # The artifact root is `apps/` (upload-artifact keeps the least common
      # ancestor of its paths), so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      # The WSL backend runs the Linux CLI archive inside the distro, so the
      # Windows desktop embeds the same archive the release attaches.
      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Download RHEL 8-compatible Linux native components
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v8
        with:
          name: linux-native-x64
          path: linux-native

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          # Keep packaged auto-updates on Treher releases even if this workflow
          # is later invoked from a context with a different GITHUB_REPOSITORY.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: MTVaught/t3code
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --skip-build
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            # Embed the Linux CLI archive built by build_linux_cli as the WSL
            # runtime. Required for a working WSL backend on Windows.
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz)
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            args+=(--linux-native-prebuilds "$GITHUB_WORKSPACE/linux-native")
            echo "Using RHEL 8-compatible Linux native components."
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      # The single-executable is built with a Node that supports --build-sea
      # (25.7+); the repo itself stays on the engines.node version. It always
      # injects into the runner's own Node: tsdown's cross-target download path
      # runs `tar` on a drive-letter path on Windows, which GNU tar reads as a
      # remote host, and a cross-built macOS binary cannot be smoke-tested.
      - name: Build CLI single-executable
        if: matrix.cli_archive
        shell: bash
        env:
          # The exact version, not a major: vp downloads it from nodejs.org/dist on
          # the runner, and only exact versions have a dist directory. Keep in
          # step with SEA_NODE_VERSION in apps/server/vite.config.ts.
          VP_NODE_VERSION: "26.8.2"
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Import macOS signing certificate for the CLI archive
        if: matrix.cli_archive && matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "macOS CLI signing disabled (missing CSC_LINK); the archive is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/t3-cli-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          cert_path="$RUNNER_TEMP/t3-cli-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity found in CSC_LINK." >&2
            exit 1
          fi
          echo "::add-mask::$keychain_password"
          echo "T3CODE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "macOS CLI signing enabled."

      - name: Stage resource monitor for the CLI archive
        if: matrix.cli_archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          target_dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      - name: Build CLI archive
        if: matrix.cli_archive
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "mac" && -n "${APPLE_API_KEY:-}" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_cli_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        if: matrix.cli_archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ needs.preflight.outputs.version }}"

      - name: Upload CLI archive
        if: matrix.cli_archive
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            source_path="linux-native/${binary_name}"
          else
            source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          fi
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error

  verify_linux_rhel8:
    name: Verify Linux artifact on RHEL 8
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: rockylinux:8
    timeout-minutes: 15
    steps:
      - name: Install Electron runtime dependencies
        run: dnf install -y gtk3 nss alsa-lib libX11-xcb libdrm mesa-libgbm libxkbcommon libXcomposite libXdamage libXrandr cups-libs at-spi2-atk binutils findutils xdg-utils xorg-x11-server-Xvfb

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: release-linux

      - name: Extract and verify packaged native functionality
        shell: bash
        run: |
          set -euo pipefail
          test "$(rpm -E '%{rhel}')" = "8"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          app_image="$(find release-linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$app_image"
          chmod +x "$app_image"
          "$app_image" --appimage-extract >/dev/null

          native_root="squashfs-root/resources/app.asar.unpacked/node_modules"
          while IFS= read -r -d '' binary; do
            # SnapShots pieces are Wayland-only on Linux and never run at
            # startup: xa11y is imported lazily by a capture worker, and the
            # Hyprland and KDE helpers are copied out of the bundle only when
            # that compositor is detected during setup. RHEL 8 runs none of
            # them, so a newer glibc there is harmless; everything else must load.
            case "$binary" in
              *"/@crowecawcaw/xa11y-"* | \
              squashfs-root/resources/hyprland-capture/* | \
              squashfs-root/resources/kde-capture/*)
                continue
                ;;
            esac
            if ! readelf --file-header "$binary" >/dev/null 2>&1; then
              continue
            fi
            required="$(
              readelf --version-info "$binary" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sort -Vu \
                | tail -1 \
                || true
            )"
            if [[ -n "$required" ]] && \
              [[ "$(printf '%s\n' "$required" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]]; then
              echo "$binary requires $required; RHEL 8 provides GLIBC_2.28." >&2
              exit 1
            fi
          done < <(find squashfs-root -type f -print0)

          printf '%s\n' '{"type":"shutdown","version":2}' \
            | squashfs-root/resources/resource-monitor/t3-resource-monitor \
            | grep '"type":"hello"'

          ELECTRON_RUN_AS_NODE=1 squashfs-root/t3code - <<'NODE'
          const nodePty = require(`${process.cwd()}/squashfs-root/resources/app.asar/node_modules/node-pty`);
          const terminal = nodePty.spawn("/bin/sh", ["-c", "printf packaged-rhel8-pty-ok"], {
            name: "xterm",
            cols: 80,
            rows: 24,
          });
          let output = "";
          terminal.onData((chunk) => (output += chunk));
          terminal.onExit(({ exitCode }) => {
            if (exitCode !== 0 || !output.includes("packaged-rhel8-pty-ok")) process.exit(1);
          });
          NODE

          touch rhel8-fff-probe.txt
          ELECTRON_RUN_AS_NODE=1 squashfs-root/t3code --input-type=module - <<'NODE'
          import { pathToFileURL } from "node:url";
          const entry = pathToFileURL(
            `${process.cwd()}/squashfs-root/resources/app.asar/node_modules/@ff-labs/fff-node/dist/src/index.js`,
          ).href;
          const { FileFinder } = await import(entry);
          const result = FileFinder.create({ basePath: process.cwd(), disableMmapCache: true });
          if (!result.ok) throw new Error(result.error);
          const finder = result.value;
          const ready = await finder.waitForIndexReady(15_000);
          const search = finder.fileSearch("rhel8-fff-probe.txt", { pageSize: 10 });
          finder.destroy();
          if (!ready.ok || !ready.value || !search.ok || search.value.items.length === 0) {
            throw new Error("packaged fff search failed on RHEL 8");
          }
          NODE

          set +e
          timeout --signal=TERM --kill-after=5s 20s \
            xvfb-run -a squashfs-root/t3code --no-sandbox --disable-gpu \
            >rhel8-desktop.log 2>&1
          desktop_status=$?
          set -e
          if [[ "$desktop_status" != 0 && "$desktop_status" != 124 ]]; then
            cat rhel8-desktop.log
            echo "Desktop exited unexpectedly with status $desktop_status." >&2
            exit "$desktop_status"
          fi
          for marker in "backend ready" "main window created"; do
            if ! grep -Fq "$marker" rhel8-desktop.log; then
              cat rhel8-desktop.log
              echo "Desktop log did not contain: $marker" >&2
              exit 1
            fi
          done

  release:
    name: Publish GitHub Release
    needs: [preflight, build, build_linux_cli, verify_linux_rhel8]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.build_linux_cli.result == 'success' && needs.verify_linux_rhel8.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork note: upstream minted a GitHub App token (RELEASE_APP_ID /
    # RELEASE_APP_PRIVATE_KEY) here. A fork can publish releases with the
    # built-in GITHUB_TOKEN instead, which softprops/action-gh-release uses by
    # default, so the app-token step was removed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers, `t3 update`, and the desktop's runtime installs verify
      # archives against this file, so it is written from the signed bytes that
      # get uploaded, never from an earlier stage.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
