name: Release
on:
  push:
    tags: ["v*-treher.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Optional preview version, for example 0.1.7-preview.20261106.1
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && 'stable' || github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'MTVaught/t3code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release
        id: meta
        env:
          PREVIEW_VERSION: ${{ inputs.version }}
        run: node .github/scripts/fork-release.cjs >> "$GITHUB_OUTPUT"
      - name: Require stable tag to be on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor HEAD origin/main
  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
  macos:
    needs: preflight
    uses: ./.github/workflows/macos-build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit
  publish:
    name: Publish GitHub Release
    if: github.repository == 'MTVaught/t3code'
    needs: [preflight, quality, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ needs.preflight.outputs.version }}
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          name: macos-${{ needs.preflight.outputs.version }}
          path: release-assets
      - name: Validate artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          set -euo pipefail
          python3 scripts/fork/check-release-assets.py release-assets "$RELEASE_VERSION" "$CHANNEL"
          cd release-assets
          sha256sum -- *.tar.gz *.dmg *.zip > SHA256SUMS
          args=(--repo MTVaught/t3code --target "$GITHUB_SHA" --title "T3 Code $RELEASE_VERSION" --generate-notes --notes-file macos-signing.txt)
          if [[ "$CHANNEL" == preview ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release create "$RELEASE_TAG" ./* "${args[@]}"
