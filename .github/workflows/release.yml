name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

# Fork note: the upstream nightly `schedule:` trigger and its `check_changes`
# job were removed so a fork does not build (and publish) every few hours and
# burn Actions minutes. Trigger releases via a `v*.*.*` tag push or a manual
# "Run workflow" (workflow_dispatch). Re-add the schedule block if you want
# automated nightlies.

permissions:
  contents: read
  id-token: none

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # A push to a branch (for example main) has no human-picked semver,
          # so publish it through the nightly/prerelease channel, which derives
          # a version from the date + run number + SHA. Stable releases still
          # come from a v*.*.* tag push or a workflow_dispatch with a version.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" \
             || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ) \
             || ( "${GITHUB_EVENT_NAME}" == "push" && "${REF_TYPE}" == "branch" ) ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases require the version input." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=T3 Code v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  # The WSL backend runs under Linux Node and cannot load Electron's Windows
  # node-pty binary. Build the Linux binary separately for the Windows package.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    # The runner's glibc becomes the shipped pty.node floor; bump deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_linux_native:
    name: Build Linux native components (RHEL 8 ABI)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    container: rockylinux:8
    timeout-minutes: 30
    env:
      # Keep this source revision aligned with @ff-labs/fff-node in
      # apps/server/package.json. Its npm Linux binary currently requires a
      # newer glibc than RHEL 8, so releases rebuild the same C ABI here.
      FFF_SOURCE_REF: 7d7910b6ba78ea8406671eaac8cdb5eb9850d9d1
      FFF_SOURCE_VERSION: 0.9.4
    steps:
      - name: Install RHEL 8 build dependencies
        run: dnf install -y git gcc gcc-c++ make python3.11 perl-core cmake curl xz tar gzip binutils

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Checkout fff source
        uses: actions/checkout@v6
        with:
          repository: dmtrKovalenko/fff
          ref: ${{ env.FFF_SOURCE_REF }}
          path: .release/fff

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build native components
        shell: bash
        env:
          PYTHON: /usr/bin/python3.11
        run: |
          set -euo pipefail
          node_pty_version="$(node -p "require('./apps/server/package.json').dependencies['node-pty'].replace(/^\\^/, '')")"
          fff_version="$(node -p "require('./apps/server/package.json').dependencies['@ff-labs/fff-node']")"
          if [[ "$fff_version" != "$FFF_SOURCE_VERSION" ]]; then
            echo "Update FFF_SOURCE_REF/FFF_SOURCE_VERSION for @ff-labs/fff-node $fff_version." >&2
            exit 1
          fi

          mkdir -p .release/native-runtime linux-native
          npm install --ignore-scripts --prefix .release/native-runtime \
            "node-pty@$node_pty_version" \
            "@ff-labs/fff-node@$fff_version"
          node_pty_dir="$PWD/.release/native-runtime/node_modules/node-pty"
          (
            cd "$node_pty_dir"
            npx --yes node-gyp@12.4.0 configure
            # GCC 8 implements C++20 under its provisional gnu++2a spelling.
            # The language mode is equivalent for node-pty, while retaining
            # RHEL 8's system libstdc++ ABI floor.
            sed -i 's/-std=gnu++20/-std=gnu++2a/g' build/*.mk
            make -C build BUILDTYPE=Release
            node scripts/post-install.js
          )

          cargo build --locked --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu
          cargo build --locked --release \
            --manifest-path .release/fff/Cargo.toml \
            --package fff-c \
            --target x86_64-unknown-linux-gnu

          cp .release/native-runtime/node_modules/node-pty/build/Release/pty.node \
            linux-native/pty.node
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            linux-native/t3-resource-monitor
          cp .release/fff/target/x86_64-unknown-linux-gnu/release/libfff_c.so \
            linux-native/libfff_c.so
          cp linux-native/libfff_c.so \
            .release/native-runtime/node_modules/@ff-labs/fff-bin-linux-x64-gnu/libfff_c.so

      - name: Verify native functionality on RHEL 8
        shell: bash
        run: |
          set -euo pipefail
          test "$(rpm -E '%{rhel}')" = "8"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"

          for binary in linux-native/pty.node linux-native/t3-resource-monitor linux-native/libfff_c.so; do
            required="$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)"
            if [[ "$(printf '%s\n' "$required" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]]; then
              echo "$binary requires $required; RHEL 8 provides GLIBC_2.28." >&2
              exit 1
            fi
          done

          node <<'NODE'
          const nodePty = require("./.release/native-runtime/node_modules/node-pty");
          const terminal = nodePty.spawn("/bin/sh", ["-c", "printf rhel8-pty-ok"], {
            name: "xterm",
            cols: 80,
            rows: 24,
          });
          let output = "";
          terminal.onData((chunk) => (output += chunk));
          terminal.onExit(({ exitCode }) => {
            if (exitCode !== 0 || !output.includes("rhel8-pty-ok")) process.exit(1);
          });
          NODE

          printf '%s\n' '{"type":"shutdown","version":2}' \
            | linux-native/t3-resource-monitor \
            | grep '"type":"hello"'

          node --input-type=module <<'NODE'
          import { FileFinder } from "./.release/native-runtime/node_modules/@ff-labs/fff-node/dist/src/index.js";
          const result = FileFinder.create({ basePath: process.cwd(), disableMmapCache: true });
          if (!result.ok) throw new Error(result.error);
          const finder = result.value;
          const ready = await finder.waitForIndexReady(15_000);
          if (!ready.ok || !ready.value) throw new Error("fff index did not become ready");
          const search = finder.fileSearch("package.json", { pageSize: 10 });
          finder.destroy();
          if (!search.ok || !search.value.items.some((item) => item.relativePath === "package.json")) {
            throw new Error("fff did not find package.json");
          }
          NODE

      - name: Upload RHEL 8-compatible native components
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-x64
          path: linux-native/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # Native prebuild jobs are in `needs` for ordering/artifact availability. Do not
    # require their success here: `!cancelled()` lets unaffected platforms build;
    # the platform-specific artifact download fails only the dependent build.
    needs: [preflight, build_wsl_node_pty, build_linux_native]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Fork note: the upstream relay public-config job (which reads T3 Connect
    # public config out of Cloudflare) was removed, so these T3CODE_CLERK_* /
    # T3CODE_RELAY_URL values are not injected here. Builds are unsigned and
    # point at no relay. Set them as repo variables/secrets and wire them back
    # in if you run your own relay.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Download RHEL 8-compatible Linux native components
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v7
        with:
          name: linux-native-x64
          path: linux-native

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
              magick -version
          else
              convert -version
          fi

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            args+=(--linux-native-prebuilds "$GITHUB_WORKSPACE/linux-native")
            echo "Using RHEL 8-compatible Linux native components."
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            source_path="linux-native/${binary_name}"
          else
            source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          fi
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  verify_linux_rhel8:
    name: Verify Linux artifact on RHEL 8
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: rockylinux:8
    timeout-minutes: 15
    steps:
      - name: Install Electron runtime dependencies
        run: dnf install -y gtk3 nss alsa-lib libX11-xcb libdrm mesa-libgbm libxkbcommon libXcomposite libXdamage libXrandr cups-libs at-spi2-atk binutils findutils xdg-utils xorg-x11-server-Xvfb

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: release-linux

      - name: Extract and verify packaged native functionality
        shell: bash
        run: |
          set -euo pipefail
          test "$(rpm -E '%{rhel}')" = "8"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          app_image="$(find release-linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$app_image"
          chmod +x "$app_image"
          "$app_image" --appimage-extract >/dev/null

          native_root="squashfs-root/resources/app.asar.unpacked/node_modules"
          while IFS= read -r -d '' binary; do
            if ! readelf --file-header "$binary" >/dev/null 2>&1; then
              continue
            fi
            required="$(
              readelf --version-info "$binary" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sort -Vu \
                | tail -1 \
                || true
            )"
            if [[ -n "$required" ]] && \
              [[ "$(printf '%s\n' "$required" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]]; then
              echo "$binary requires $required; RHEL 8 provides GLIBC_2.28." >&2
              exit 1
            fi
          done < <(find squashfs-root -type f -print0)

          printf '%s\n' '{"type":"shutdown","version":2}' \
            | squashfs-root/resources/resource-monitor/t3-resource-monitor \
            | grep '"type":"hello"'

          ELECTRON_RUN_AS_NODE=1 squashfs-root/t3code - <<'NODE'
          const nodePty = require(`${process.cwd()}/squashfs-root/resources/app.asar/node_modules/node-pty`);
          const terminal = nodePty.spawn("/bin/sh", ["-c", "printf packaged-rhel8-pty-ok"], {
            name: "xterm",
            cols: 80,
            rows: 24,
          });
          let output = "";
          terminal.onData((chunk) => (output += chunk));
          terminal.onExit(({ exitCode }) => {
            if (exitCode !== 0 || !output.includes("packaged-rhel8-pty-ok")) process.exit(1);
          });
          NODE

          touch rhel8-fff-probe.txt
          ELECTRON_RUN_AS_NODE=1 squashfs-root/t3code --input-type=module - <<'NODE'
          import { pathToFileURL } from "node:url";
          const entry = pathToFileURL(
            `${process.cwd()}/squashfs-root/resources/app.asar/node_modules/@ff-labs/fff-node/dist/src/index.js`,
          ).href;
          const { FileFinder } = await import(entry);
          const result = FileFinder.create({ basePath: process.cwd(), disableMmapCache: true });
          if (!result.ok) throw new Error(result.error);
          const finder = result.value;
          const ready = await finder.waitForIndexReady(15_000);
          const search = finder.fileSearch("rhel8-fff-probe.txt", { pageSize: 10 });
          finder.destroy();
          if (!ready.ok || !ready.value || !search.ok || search.value.items.length === 0) {
            throw new Error("packaged fff search failed on RHEL 8");
          }
          NODE

          set +e
          timeout --signal=TERM --kill-after=5s 20s \
            xvfb-run -a squashfs-root/t3code --no-sandbox --disable-gpu \
            >rhel8-desktop.log 2>&1
          desktop_status=$?
          set -e
          if [[ "$desktop_status" != 0 && "$desktop_status" != 124 ]]; then
            cat rhel8-desktop.log
            echo "Desktop exited unexpectedly with status $desktop_status." >&2
            exit "$desktop_status"
          fi
          for marker in "backend ready" "main window created"; do
            if ! grep -Fq "$marker" rhel8-desktop.log; then
              cat rhel8-desktop.log
              echo "Desktop log did not contain: $marker" >&2
              exit 1
            fi
          done

  release:
    name: Publish GitHub Release
    needs: [preflight, build, verify_linux_rhel8]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.verify_linux_rhel8.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fork note: upstream minted a GitHub App token (RELEASE_APP_ID /
    # RELEASE_APP_PRIVATE_KEY) here. A fork can publish releases with the
    # built-in GITHUB_TOKEN instead, which softprops/action-gh-release uses by
    # default, so the app-token step was removed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
