name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        required: false
        default: 0.1.7-preview.20000101.1
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  T3CODE_TELEMETRY_ENABLED: "false"
  DO_NOT_TRACK: "1"
  VP_REMOTE_CACHE: "off"
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run knip:check
      - run: vp check
      - run: node --test .github/scripts/fork-release.test.cjs
  build:
    name: Build and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run --filter '@t3tools/desktop...' --filter 't3...' --filter '@t3tools/scripts' --filter '@t3tools/oxlint-plugin-t3code' typecheck
      - run: vp run build:desktop
      - run: node apps/desktop/scripts/verify-preload-bundle.mjs
  test:
    name: Test packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run --parallel --filter '@t3tools/desktop...' --filter 't3...' --filter '@t3tools/scripts' --filter '@t3tools/oxlint-plugin-t3code' --filter '!@t3tools/web' --filter '!t3' test
  web:
    name: Test web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - run: vp run --filter @t3tools/web test
  server:
    name: Test server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - run: vp run --filter t3 test --shard=${{ matrix.shard }}/4
  linux:
    name: RHEL 8 artifacts
    uses: ./.github/workflows/linux-build.yml
    with:
      version: ${{ inputs.version || '0.1.7-preview.20000101.1' }}
  check:
    name: Check
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, build, test, web, server, linux]
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
